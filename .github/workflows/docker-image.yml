name: Build and Push Docker pdfreactor and kubectl Image CI

on: 
  workflow_dispatch:
  release:
    types:
      - published

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      TAG: ${{ github.event.release.tag_name || 'latest' }}

    permissions:
      contents: write
      packages: write

    steps:
      
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo wget https://github.com/mikefarah/yq/releases/download/v4.43.1/yq_linux_amd64 -O /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      # A chart cannot be recalled by deleting the release that produced it: the
      # gh-pages index keeps serving it. Chart versions sort by date, so a mis-dated
      # tag outranks every real release and becomes what `helm search repo` and any
      # unpinned install resolve. In the web repo, tag 26.09.29.00 (a typo for
      # 26.06.29.00) was published, deleted 23 minutes later, and still topped the
      # index for six weeks until charts@a37a234 purged it.
      #
      # Unconditional here, unlike the web repo's copy, because every step below is
      # unconditional: this workflow has no image-only mode, so each run publishes a
      # chart and pushes a commit to master. That makes workflow_dispatch unsafe
      # today -- it has no tag input, so TAG falls back to 'latest' and
      # ${GIT_TAG%.*}${GIT_TAG##*.} yields the chart version 'latestlatest'. Such a
      # run now stops here instead of publishing that.
      - name: Guard against a mis-dated release tag
        env:
          GIT_TAG: ${{ env.TAG }}
        run: |
          if [[ ! "$GIT_TAG" =~ ^[0-9]{2}\.[0-9]{2}\.[0-9]{2}\.[0-9]{2}$ ]]; then
            echo "::error::Refusing to publish: tag '$GIT_TAG' is not YY.MM.DD.NN." \
                 "Run this workflow from a published release, not workflow_dispatch."
            exit 1
          fi

          TAG_DATE="20${GIT_TAG%.*}"    # 26.07.14.00 -> 2026.07.14
          TAG_DATE="${TAG_DATE//./-}"   #             -> 2026-07-14
          if ! date -u -d "$TAG_DATE" +%F >/dev/null 2>&1; then
            echo "::error::Refusing to publish: tag '$GIT_TAG' is not a real calendar date."
            exit 1
          fi

          # Accepts today and tomorrow: the runner is UTC and releases are cut from
          # US zones, so a tag can legitimately read one day behind the runner's date.
          LIMIT="$(date -u -d "$(date -u +%F) +2 days" +%s)"
          if (( $(date -u -d "$TAG_DATE" +%s) >= LIMIT )); then
            echo "::error::Refusing to publish: tag '$GIT_TAG' is dated in the future" \
                 "(today is $(date -u +%y.%m.%d) UTC). Re-cut the release with today's date."
            exit 1
          fi

          echo "Tag '$GIT_TAG' is a well-formed, non-future release date."

      - name: Bump chart versions and set image.tag
        run: |
          CHART_FILE="helm/Chart.yaml"
          VALUES_FILE="helm/values.yaml"
          GIT_TAG=${{ env.TAG  }}

          echo "Using Git tag: $GIT_TAG"

          # Format the chart version to be compatible with Semantic Versioning 2.0.0 using the format YY.MM.DDNN
          new_chart_version=${GIT_TAG%.*}${GIT_TAG##*.}

          # Update Chart.yaml
          yq -i ".appVersion = \"$GIT_TAG\"" "$CHART_FILE"
          yq -i ".version = \"$new_chart_version\"" "$CHART_FILE"

          # Update values.yaml image.tag
          yq -i ".image.tag = \"$GIT_TAG\"" "$VALUES_FILE"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Use these credientials because we're pushing the tag below to the GitHub Container Registry
      - name: Log in to GitHub Container Registry using our credentials
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 #hash for v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
  
      - name: Build and push with cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          build-args: |
            VERSION=${{ env.TAG  }}
          push: true
          tags: |
            ghcr.io/bluestep-systems/pdfreactor:${{  github.ref_name }}
            ghcr.io/bluestep-systems/pdfreactor:latest
          cache-from: type=gha
          cache-to: type=gha

      - name: Commit updated Helm files
        if: success()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add helm/Chart.yaml helm/values.yaml
          git commit -m "chore(helm): Update ${GIT_TAG} in Chart.yaml and values.yaml" || echo "No changes to commit"
          git push origin HEAD:refs/heads/master
  
      - name: Set up SSH for pushing to charts repo
        if: success()
        env:
          DEPLOY_KEY: ${{ secrets.CHARTS_DEPLOY_KEY }}
          DEPLOY_KEY_PUB: ${{ vars.CHARTS_DEPLOY_KEY_PUB }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "$DEPLOY_KEY_PUB" > ~/.ssh/id_rsa.pub
          chmod 644 ~/.ssh/id_rsa.pub
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Package and push Helm chart to gh-pages
        if: success()
        run: |
          CHART_NAME=pdfreactor
          CHART_VERSION=$(yq '.version' helm/Chart.yaml)
          rm -rf charts || true
          git clone --branch gh-pages git@github.com:Bluestep-Systems/charts.git
          
          # Package chart
          helm package helm/ --destination charts
          # Update index.yaml
          helm repo index charts --url https://bluestep-systems.github.io/charts/

          # Git commit and push
          cd charts
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "Publish $CHART_NAME v$CHART_VERSION"
          git push

