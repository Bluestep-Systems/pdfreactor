# Default values for pdfreactor.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Single replica: the PDFReactor license only permits one running instance, so
# we can't scale out. Note this means readiness has no sibling to shed to.
replicaCount: 1
image:
  repository: ghcr.io/bluestep-systems/pdfreactor
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "26.07.14.00"
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""
podAnnotations: {}
podSecurityContext: {}
# fsGroup: 2000

securityContext: {}
# capabilities:
#   drop:
#   - ALL
# readOnlyRootFilesystem: true
# runAsNonRoot: true
# runAsUser: 1000

service:
  type: ClusterIP
  port: 80
resources:
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  limits:
    cpu: 4
    memory: 4Gi
  requests:
    cpu: 1
    memory: 4Gi
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80
nodeSelector: {}
tolerations: []
affinity: {}
licensekey: "always-replace-this-license-key"
# The license key is stored in a Kubernetes secret

# ExternalSecrets configuration - pulls secrets from Bitwarden Secrets Manager via ESO
# Note: Uses ExternalSecret CRD with ClusterSecretStore
externalSecrets:
  enabled: false
  refreshInterval: 1h
  secretStoreRef:
    name: bws-dev-shared
    kind: ClusterSecretStore
  data: []
  # - secretKey: licensekey.txt
  #   remoteKey: PDFREACTOR_LICENSE_KEY
  # - secretKey: PDFREACTOR_ADMINKEY
  #   remoteKey: PDFREACTOR_ADMIN_KEY
ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
configmap:
  data:
    # conversionTimeout (seconds) aborts any single render that runs longer than
    # this, so a runaway/pathological document can't pin a worker thread + heap
    # indefinitely and drag the whole service into GC thrash. 0 (the default) =
    # no limit. See RealObjects WS manual "Server Parameters".
    # -Xlog gc+safepoint to stdout so `kubectl logs` shows it without exec'ing in.
    # The pod intermittently stops answering every HTTP path for >=60s, including
    # the kubelet's direct-to-pod liveness probe, while sitting at ~7% of its CPU
    # quota. A stop-the-world pause and CPU starvation look identical from
    # outside; this is what tells them apart on the next occurrence. Safe to drop
    # once CU-86bbqrrrt is settled.
    JAVA_OPTIONS: "-XX:ActiveProcessorCount=4 -XX:InitialRAMPercentage=45 -XX:MaxRAMPercentage=45 -Dcom.realobjects.pdfreactor.webservice.conversionTimeout=120 -Xlog:gc*,safepoint:stdout:time,uptime,level,tags"
    PDFREACTOR_ADMINKEY: "always-replace-this-secret"
