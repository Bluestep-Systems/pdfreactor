apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pdfreactor.fullname" . }}
  labels:
    {{- include "pdfreactor.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "pdfreactor.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "pdfreactor.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "pdfreactor.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          envFrom:
          - configMapRef:
              name: "{{ include "pdfreactor.fullname" . }}-configmap"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          volumeMounts:
          - name: licensefile
            mountPath: /ro/config
          ports:
            - name: http
              containerPort: 9423
              protocol: TCP
          # Startup gates liveness/readiness until the JVM + PDFReactor engine
          # are actually up, so a slow cold start (font-cache warm, etc.) can't
          # trip an early liveness kill. Generous: up to 30*10s = 5min to boot.
          startupProbe:
            httpGet:
              path: "/service/monitor/server?adminKey={{ .Values.configmap.data.PDFREACTOR_ADMINKEY }}"
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          # Liveness only fires for a truly dead pod. Timing is explicit so it
          # doesn't inherit the k8s default timeoutSeconds:1 (a brief GC pause
          # would otherwise fail the monitor 3x and get the pod SIGKILLed). The
          # kill window (periodSeconds*failureThreshold = 150s) is deliberately
          # wider than the 120s conversionTimeout, so a max-length render is
          # aborted (freeing its thread) before the pod could ever be killed.
          livenessProbe:
            httpGet:
              path: "/service/monitor/server?adminKey={{ .Values.configmap.data.PDFREACTOR_ADMINKEY }}"
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 10
          # No readiness probe: the license permits only one replica, so pulling
          # the sole pod from the Service on saturation would be a 100% outage
          # rather than shedding load. The relaxed liveness window above is the
          # backstop instead.
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
      - name: licensefile
        secret:
           secretName: "{{ include "pdfreactor.fullname" . }}-license"