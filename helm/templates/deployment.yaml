{{- include "pdfreactor.validateAdminKeySource" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pdfreactor.fullname" . }}
  labels:
    {{- include "pdfreactor.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "pdfreactor.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "pdfreactor.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "pdfreactor.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          envFrom:
          - configMapRef:
              name: "{{ include "pdfreactor.fullname" . }}-configmap"
          # The admin key is a secret and comes from the Secret, never the
          # ConfigMap. An explicit `env` entry outranks a same-named key arriving
          # via envFrom, so this stays authoritative even against a stale
          # ConfigMap that still carries one.
          env:
          - name: PDFREACTOR_ADMINKEY
            valueFrom:
              secretKeyRef:
                name: "{{ include "pdfreactor.fullname" . }}-license"
                key: PDFREACTOR_ADMINKEY
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          volumeMounts:
          - name: licensefile
            mountPath: /ro/config
          ports:
            - name: http
              containerPort: 9423
              protocol: TCP
          # Startup gates liveness/readiness until the JVM + PDFReactor engine
          # are actually up, so a slow cold start (font-cache warm, etc.) can't
          # trip an early liveness kill. Generous: up to 30*10s = 5min to boot.
          startupProbe:
            exec:
              command:
                {{- include "pdfreactor.monitorProbe" . | nindent 16 }}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          # Timing is explicit so it doesn't inherit the k8s default
          # timeoutSeconds:1 (a brief pause would otherwise fail the monitor 3x
          # and get the pod SIGKILLed).
          #
          # failureThreshold was 10 (a 150s kill window), chosen to sit wider
          # than the 120s conversionTimeout on the theory that a max-length
          # render could starve the probe. A thread dump from the wedged pod
          # (CU-86bbqrrrt) disproves that: renders run on PDFReactor's own
          # "conversion-pool-thread-*" executor, not on the Jetty pool the
          # monitor endpoint is served from, so a long conversion cannot fail
          # this probe.
          #
          # That window also made the probe blind to the failure it most needs
          # to catch. Jetty runs one selector per 2 cores, so ActiveProcessorCount=4
          # gives 2; when one selector thread dies, every connection assigned to
          # it hangs forever while the other half is served normally. Ten
          # CONSECUTIVE failures essentially never occur at a ~50% failure rate,
          # so the pod sat half-dead for 19 days without ever restarting. At 4,
          # the window is still 60s -- longer than any healthy response -- but a
          # half-dead pod now self-heals in a couple of minutes.
          livenessProbe:
            exec:
              command:
                {{- include "pdfreactor.monitorProbe" . | nindent 16 }}
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          # No readiness probe: the license permits only one replica, so pulling
          # the sole pod from the Service on saturation would be a 100% outage
          # rather than shedding load. The relaxed liveness window above is the
          # backstop instead.
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
      - name: licensefile
        secret:
           secretName: "{{ include "pdfreactor.fullname" . }}-license"
           # Project only the licence file. The same Secret also carries
           # PDFREACTOR_ADMINKEY (consumed as env above); without this projection
           # the key would additionally land as a stray file in the licence
           # directory that nothing reads.
           items:
           - key: licensekey.txt
             path: licensekey.txt